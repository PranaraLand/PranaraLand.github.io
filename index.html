<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PranaraLand | Portal</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #31475c; color: #fff; font-family: Avenir, Arial, sans-serif; }
    .hero { position: relative; isolation: isolate; overflow: hidden; min-height: 100vh; min-height: 100svh; display: grid; align-items: center; padding: clamp(24px, 7vw, 100px); }
    .facade, .hero::after { position: absolute; inset: 0; width: 100%; height: 100%; }
    .facade { z-index: -2; object-fit: cover; object-position: 57% center; animation: zoom-out 7s cubic-bezier(.2,.7,.2,1) both; }
    .hero::after { content: ""; z-index: -1; background: linear-gradient(90deg, #14243392, #14243312 80%), linear-gradient(0deg, #142433a6, #14243325 76%); }
    .hero > picture { position: absolute; inset: 0; z-index: -2; }
    .pranara-logo { display: none; }
    .hero > div { transform: translateY(2svh); }
    @media (max-width: 600px) and (orientation: portrait) {
      .hero { align-items: start; padding-top: max(24px, clamp(150px, 43svh, 420px)); }
      .hero > div { transform: none; }
      .facade { object-position: center; }
      .pranara-logo {
        display: block;
        position: absolute;
        top: 19%;
        left: 50%;
        width: clamp(96px, 29vw, 150px);
        height: auto;
        transform: translate(-50%, -50%);
        filter: drop-shadow(0 2px 9px #14243366);
      }
    }
    h1 { margin: 0 0 24px; font: 400 clamp(32px, 10vw, 96px)/.98 Georgia, serif; letter-spacing: -.045em; }
    a { display: inline-flex; align-items: center; gap: 14px; min-height: 48px; padding: 12px 18px; background: #f5efea; color: #253a4b; border-radius: 5px; font-weight: 700; text-decoration: none; }
    a:hover { background: #fff; }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
    .portal { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; max-width: 780px; }
    .portal-card { display: grid; gap: 5px; align-content: center; min-height: 85px; padding: 14px 16px; border-radius: 6px; background: #f5efea; color: #253a4b; }
    .portal-card strong { font-size: 17px; }
    .portal-card small { font-size: 12px; line-height: 1.4; font-weight: 500; }
    .portal-card[aria-disabled="true"] { background: #eae6e6; color: #4d5b67; }
    @media (max-width: 680px) {
      .portal { grid-template-columns: 1fr; max-width: 460px; }
      .portal-card { min-height: 56px; gap: 3px; padding: 10px 14px; }
    }
    @keyframes zoom-out { from { transform: scale(1.14); } to { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .facade { animation: none; } }
  </style>
</head>
<body>
  <main class="hero">
    <picture>
      <source media="(max-width: 600px) and (orientation: portrait)" srcset="./assets/aruna-facade-portrait.webp">
      <img class="facade" src="./assets/pranara-facade-hero.webp" alt="Fasad townhouse Pranara Cilandak" fetchpriority="high">
    </picture>
    <img class="pranara-logo" src="./assets/pranara-logo-white.svg" width="86" height="40" alt="Pranara">
    <div>
      <h1>PranaraLand</h1>
      <nav class="portal" aria-label="Portal PranaraLand">
        <a class="portal-card" href="https://pranaraland-os.bright-flint-7504.chatgpt.site/crm"><strong>CRM <span aria-hidden="true">→</span></strong><small>Customer Relationship Management</small></a>
        <div class="portal-card" aria-disabled="true"><strong>CRS</strong><small>Creative Studio · Segera hadir</small></div>
        <a class="portal-card" href="/Crc"><strong>CRC <span aria-hidden="true">→</span></strong><small>Craft &amp; Construction</small></a>
      </nav>
    </div>
  </main>
</body>
</html>
